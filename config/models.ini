version = 1

; Shared defaults for every model in ~/models/llama.cpp
[*]
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
; vision encoder needs headroom on the 6 GB RTX 4050
fit-target = 200

; Computer-use agent (~/cua/agent.py). Fully on GPU, ~2.5 s per screenshot.
; 2 slots: slot 0 = agent loop (keeps its prompt cache), slot 1 = zoom/refine pass. 16k ctx each.
[Holo-3.1-4B]
ctx-size = 32768
parallel = 2
; n-gram speculation: ~8% faster generation, no extra VRAM. (A Holo-0.8B draft model was slower:
; the draft cannot see image embeddings, so only ~1/3 of its tokens are accepted.)
spec-type = ngram-mod
spec-ngram-mod-n-match = 8
spec-ngram-mod-n-min = 4
spec-ngram-mod-n-max = 16
image-min-tokens = 1024
; 1280 instead of ~2100 tokens per 1080p screenshot: grounding 2.5 s vs 3.8 s for -2 points (67.6% vs 69.6%)
image-max-tokens = 1280

; Bigger Holo; benchmarked no more accurate than 4B+zoom on this machine, 2x slower.
[Holo-3.1-9B]
ctx-size = 16384
image-min-tokens = 1024
image-max-tokens = 2304

; General chat / coding / vision model
[Qwen3.5-9B]
ctx-size = 32768
image-min-tokens = 1024
image-max-tokens = 2304
